<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Demo</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    img {
      width: 100%;
      height: 500px;
      border-radius: 20px;
      object-fit: cover;
      opacity: 0.5;
      transition: transform 0.8s, opacity 0.8s;
    }

    img:hover {
      opacity: 1;
      transform: scale(1.1);
      border: 1px solid white;
    }
  </style>
</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Navbar</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link active" href="#">หน้าแรก</a></li>
        <li class="nav-item"><a class="nav-link active" href="#">บริการ</a></li>
        <li class="nav-item"><a class="nav-link active" href="#">เกี่ยวกับเรา</a></li>
        <li class="nav-item"><a class="nav-link active" href="#">ติดต่อเรา</a></li>
      </ul>

      <form class="d-flex">
        <input class="form-control me-2" type="search" placeholder="Search">
        <button class="btn btn-outline-success" type="submit">Search</button>
      </form>
    </div>
  </div>
</nav>

<!-- Gallery -->
<div class="container mt-5">
  <section>
    <h1 class="text-center mb-4">Gallery</h1>

    <div class="row g-4">
      <div class="col-md-4">
        <img class="img-fluid" src="https://ih1.redbubble.net/image.4040010203.6745/bg,f8f8f8-flat,750x,075,f-pad,750x1000,f8f8f8.u2.jpg">
      </div>

      <div class="col-md-4">
        <img class="img-fluid" src="https://ih1.redbubble.net/image.3961265909.1499/st,small,507x507-pad,600x600,f8f8f8.u2.jpg">
      </div>

      <div class="col-md-4">
        <img class="img-fluid" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ8gw-0Oj9j9IUPRAhv2PEzZRKrSlX_qof-yw&s">
      </div>
    </div>
  </section>
</div>

</body>
</html>
